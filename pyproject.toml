[project]
name = "model-forge"
version = "0.1.0"
description = "A modular, production-inspired MLOps platform for training, deploying, and monitoring machine learning models."
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",

    "pydantic",
    "pydantic-settings",

    "mlflow",
    "scikit-learn",

    "sqlalchemy",
    "alembic",
    "asyncpg",

    "celery[redis]",
    "redis",

    "prometheus-client",

    "httpx",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
[tool.uv]
package = false
